version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - cp amplify_outputs.json public/amplify_outputs.json
frontend:
  phases:
    build:
      commands:
        - VITE_FITPESO_BRANCH=$AWS_BRANCH npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
