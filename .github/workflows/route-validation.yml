name: Route migration checks
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format and report source changes
        run: |
          npx prettier --write src tests
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          const paths = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACM', '--', 'src', 'tests'], {encoding:'utf8'}).trim().split('\n').filter(Boolean)
          for (const path of paths) console.log('FORMATTED_FILE ' + JSON.stringify({path,content:readFileSync(path,'utf8')}))
          NODE
      - run: npm run check
