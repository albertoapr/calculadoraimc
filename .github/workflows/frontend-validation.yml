name: Frontend validation

on:
  push:
    branches:
      - feature/frontend-modular
      - develop
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'tsconfig*.json'
      - '.github/workflows/frontend-validation.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Format changed sources for validation
        run: |
          npx prettier --write             src/components/BirthDatePicker.vue             src/composables/useAdminTrainers.ts             src/utils/dateInput.ts             src/views/account/AdminTrainersView.vue             tests/date-input.test.ts
          node - <<'NODE'
          const fs = require('node:fs')
          const files = [
            'src/components/BirthDatePicker.vue',
            'src/composables/useAdminTrainers.ts',
            'src/utils/dateInput.ts',
            'src/views/account/AdminTrainersView.vue',
            'tests/date-input.test.ts',
          ]
          for (const file of files) {
            console.log('FORMATTED_FILE ' + file + ' ' + fs.readFileSync(file).toString('base64'))
          }
          NODE
      - run: npm run check
