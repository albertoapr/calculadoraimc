name: Frontend validation

on:
  push:
    branches:
      - feature/frontend-modular
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/frontend-validation.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Commit a reproducible lockfile on the feature branch after dependency changes.
      # Fork pull requests never push to the repository.
      - name: Update dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/frontend-modular'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: synchronize lockfile for Vue Router and Pinia"
            git push
          fi
      - run: npm ci
      - run: npm run type-check
      - run: npm run build-only
      - run: npm run test:whatsapp
