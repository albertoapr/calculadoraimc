<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitPeso API — Swagger</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; background: #fafafa; }
      .loading, .failure { max-width: 760px; margin: 48px auto; padding: 24px; font: 16px/1.5 system-ui, sans-serif; }
      .failure { color: #8b1e1e; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"><p class="loading">Carregando a documentação da API…</p></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      Promise.all([
        fetch('/openapi.json', { cache: 'no-store' }).then((response) => response.json()),
        fetch('/amplify_outputs.json', { cache: 'no-store' }).then((response) => response.json()),
      ])
        .then(([specification, outputs]) => {
          const endpoint = outputs?.custom?.imcApi?.endpoint?.replace(/\/+$/, '')
          if (endpoint) {
            specification.servers = [{ url: endpoint, description: 'Ambiente atual' }]
          }
          window.ui = SwaggerUIBundle({
            spec: specification,
            dom_id: '#swagger-ui',
            deepLinking: true,
            displayRequestDuration: true,
            filter: true,
            persistAuthorization: false,
            tryItOutEnabled: false,
          })
        })
        .catch((error) => {
          document.querySelector('#swagger-ui').innerHTML =
            '<p class="failure">Não foi possível carregar a documentação da API.</p>'
          console.error('[api-docs]', error)
        })
    </script>
  </body>
</html>
